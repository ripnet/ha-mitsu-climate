# Creates a GitHub release for every v* tag so HACS can offer versioned updates.
# The tag arrives via the Forgejo push mirror; releases themselves don't mirror.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c 'import json;print(json.load(open("custom_components/mitsu_climate/manifest.json"))["version"])')
          [ "$tag" = "$ver" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $ver"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
